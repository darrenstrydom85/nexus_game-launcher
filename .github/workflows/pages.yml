# Publishes nexus-website/ to GitHub Pages (www.nexusgamelauncher.com)
# whenever main changes it. No build step: the folder is the site.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "nexus-website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: nexus-website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: nexus-website
      - id: deployment
        uses: actions/deploy-pages@v4
